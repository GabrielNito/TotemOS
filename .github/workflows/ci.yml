name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint, Testes & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências (Backend)
        run: |
          cd apps/backend
          bun install

      - name: Gerar Prisma Client
        run: |
          cd apps/backend
          bunx prisma generate

      - name: Validar Linter (bun run lint)
        run: |
          cd apps/backend
          bun run lint

      - name: Executar Testes (bun test)
        run: |
          cd apps/backend
          bun test

      - name: Validar Build (bun run build)
        run: |
          cd apps/backend
          bun run build
