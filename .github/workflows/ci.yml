name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  totem-test:
    name: Totem Lint, Jest, Typecheck & Android Export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/totem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/totem/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - name: Exportar catálogo conectado para Android
        run: npx expo export --platform android --output-dir dist/ci-paired --clear --max-workers 2
        env:
          EXPO_PUBLIC_KIOSK_PREVIEW: "0"
      - name: Exportar demonstração para Android
        run: npx expo export --platform android --output-dir dist/ci-preview --clear --max-workers 2
        env:
          EXPO_PUBLIC_KIOSK_PREVIEW: "1"

  backend-test:
    name: Backend Lint, Testes & Build
    runs-on: ubuntu-latest
    services:
      postgres-demo:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: demo-ci-only
          POSTGRES_DB: totemos_demo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d totemos_demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências (Backend)
        run: |
          cd apps/backend
          bun install

      - name: Gerar Prisma Client
        run: |
          cd apps/backend
          bunx prisma generate

      - name: Validar Linter (bun run lint)
        run: |
          cd apps/backend
          bun run lint

      - name: Executar Testes (bun test)
        # Mantém fixtures e testes E2E também cobertos pela tipagem.
        run: |
          cd apps/backend
          bunx tsc --noEmit
          bun test

      - name: Validar Build (bun run build)
        run: |
          cd apps/backend
          bun run build

      - name: Validar migrações e contrato DEMO em PostgreSQL isolado
        env:
          DATABASE_URL: postgresql://postgres:demo-ci-only@127.0.0.1:5432/totemos_demo_test?schema=public
          DIRECT_URL: postgresql://postgres:demo-ci-only@127.0.0.1:5432/totemos_demo_test?schema=public
          DEMO_TEST_DATABASE_URL: postgresql://postgres:demo-ci-only@127.0.0.1:5432/totemos_demo_test?schema=public
        run: |
          cd apps/backend
          bunx prisma migrate deploy
          bun run test:demo:e2e
          bun run test:operacao:e2e

  dashboard-test:
    name: Dashboard Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependências (Dashboard)
        run: |
          cd apps/dashboard
          bun install

      - name: Validar Linter (bun run lint)
        run: |
          cd apps/dashboard
          bun run lint

      - name: Validar Tipagem (bun run typecheck)
        run: |
          cd apps/dashboard
          bun run typecheck

      - name: Validar Build (bun run build)
        run: |
          cd apps/dashboard
          bun run build
